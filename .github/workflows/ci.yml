name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r app/requirements.txt

      - name: Build Docker image
        run: docker build -t devsecops-security-lab .
        
      - name: Run container
        run: docker run -d --name devsecops-lab -p 5000:5000 devsecops-security-lab
      
      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            echo "Application not ready; retrying..."
            sleep 1
          done
          exit 1