name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-security-lab .
        
      - name: Run container
        run: docker run -d --name devsecops-lab -p 5000:5000 devsecops-security-lab
      
      - name: Show container logs
        run: |
          sleep 2
          docker logs devsecops-lab
      
      - name: Test health endpoint
        run: curl --fail http://localhost:5000/health